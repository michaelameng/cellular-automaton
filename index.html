<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cellular Automaton</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Cellular Automaton</h1>
      <div id="rule-picker">
        <div class="rule-row" id="birth-row">
          <span class="label">Birth</span>
          <button
            type="button"
            id="random-birth"
            class="icon-button"
            title="Randomize birth rule"
            aria-label="Randomize birth rule"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none" />
              <circle
                cx="16"
                cy="16"
                r="1.2"
                fill="currentColor"
                stroke="none"
              />
              <circle
                cx="12"
                cy="12"
                r="1.2"
                fill="currentColor"
                stroke="none"
              />
              <circle
                cx="8"
                cy="16"
                r="1.2"
                fill="currentColor"
                stroke="none"
              />
              <circle
                cx="16"
                cy="8"
                r="1.2"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </button>
          <button
            type="button"
            id="reset-birth"
            class="icon-button"
            title="Reset birth rule"
            aria-label="Reset birth rule"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="1 4 1 10 7 10" />
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
            </svg>
          </button>
        </div>
        <div class="rule-row" id="survival-row">
          <span class="label">Survival</span>
          <button
            type="button"
            id="random-survival"
            class="icon-button"
            title="Randomize survival rule"
            aria-label="Randomize survival rule"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none" />
              <circle
                cx="16"
                cy="16"
                r="1.2"
                fill="currentColor"
                stroke="none"
              />
              <circle
                cx="12"
                cy="12"
                r="1.2"
                fill="currentColor"
                stroke="none"
              />
              <circle
                cx="8"
                cy="16"
                r="1.2"
                fill="currentColor"
                stroke="none"
              />
              <circle
                cx="16"
                cy="8"
                r="1.2"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </button>
          <button
            type="button"
            id="reset-survival"
            class="icon-button"
            title="Reset survival rule"
            aria-label="Reset survival rule"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="1 4 1 10 7 10" />
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
            </svg>
          </button>
        </div>
        <div class="rule-row" id="mutation-row">
          <span class="label">Mutation</span>
          <input
            type="range"
            id="mutation-probability"
            min="0"
            max="1"
            step="0.01"
            value="0"
          />
          <span id="mutation-value">0%</span>
          <span class="label" id="size-label">Size</span>
          <input
            type="number"
            id="board-size"
            min="1"
            max="100"
            step="1"
            value="10"
          />
          <span id="size-suffix">cells per side</span>
        </div>
      </div>
      <div id="controls">
        <button
          id="step-back"
          title="Step back"
          aria-label="Step back"
          disabled
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="19 20 9 12 19 4 19 20" />
            <line x1="5" y1="19" x2="5" y2="5" />
          </svg>
        </button>
        <button id="play" title="Play" aria-label="Play" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
        </button>
        <button
          id="step-forward"
          title="Step forward"
          aria-label="Step forward"
          disabled
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="5 4 15 12 5 20 5 4" />
            <line x1="19" y1="5" x2="19" y2="19" />
          </svg>
        </button>
        <button id="random" title="Randomize" aria-label="Randomize" disabled>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none" />
            <circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none" />
            <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none" />
            <circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none" />
            <circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <button id="reset" title="Reset" aria-label="Reset" disabled>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
          </svg>
        </button>
        <p id="status"></p>
      </div>
      <div id="grid" role="grid" aria-label="Cellular automaton grid"></div>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
